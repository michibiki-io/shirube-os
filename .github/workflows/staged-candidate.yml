        env:
          STAGE: kernel
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          STAGE_INPUTS: ${{ runner.temp }}/stage-inputs
          STAGE_OUTPUT: ${{ runner.temp }}/stage-output
          KERNEL_CACHE: ${{ runner.temp }}/kernel-compiler-cache
          KERNEL_CACHE_ENABLED: ${{ github.repository == 'michibiki-io/shirube-os' && steps.kernel-cache-capability.outputs.supported == 'true' }}
          KERNEL_CACHE_WRITE: ${{ needs.admission.outputs.kernel-write == 'true' }}
        run: |
          compiler_cache=()
          if [ "$KERNEL_CACHE_ENABLED" = true ]; then
            compiler_cache=(--kernel-compile-cache "$KERNEL_CACHE")
            if [ "$KERNEL_CACHE_WRITE" = true ]; then
              compiler_cache+=(--kernel-compile-cache-write)
            fi
          fi
          python3 scripts/run-native-stage.py --stage "$STAGE" --architecture "$ARCHITECTURE" \
            --commit "$SOURCE_COMMIT" --version "$VERSION" --image "$COMPILER_IMAGE" \
            --inputs "$STAGE_INPUTS" --output "$STAGE_OUTPUT" "${compiler_cache[@]}"
