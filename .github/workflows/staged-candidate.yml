name: Staged native candidate
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      version:
        type: string
        required: true
      cache-mode:
        type: string
        default: warm
# Cache jobs inherit the caller's effective mode and cap; do not set a workflow
# default here, which would override that inheritance. Other jobs opt into read.
# Importing jobs also inherit token permissions: only Release supplies actions:read.
# Explicit contents-only grants below keep that token scope out of other jobs.
jobs:
  admission:
    permissions:
      contents: read
    cache-mode: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cache-write: ${{ steps.admit.outputs.cache-write }}
    steps:
      # Trusted inline code only: no checkout, project imports or image execution.
      - id: admit
        name: Admit exact caller source and trusted cache ownership
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          CACHE_MODE: ${{ inputs.cache-mode }}
        run: |
          python3 -I - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          def require(condition):
              if not condition:
                  raise SystemExit('Rejected staged workflow caller/source')
          commit = os.environ['SOURCE_COMMIT']
          sha = os.environ['GITHUB_SHA']
          ref = os.environ['GITHUB_REF']
          repo = os.environ['GITHUB_REPOSITORY']
          event = os.environ['GITHUB_EVENT_NAME']
          data = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          require(re.fullmatch('[0-9a-f]{40}', commit) is not None)
          require(re.fullmatch('[0-9a-f]{40}', sha) is not None)
          require(re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) is not None)
          require(data.get('repository', {}).get('full_name') == repo)
          require(os.environ['CACHE_MODE'] in {'cold', 'warm'})
          write = False
          if event == 'workflow_dispatch':
              require(ref.startswith('refs/heads/') and len(ref) > len('refs/heads/'))
              if ref == 'refs/heads/main':
                  require(commit == sha)
                  write = repo == 'michibiki-io/shirube-os'
          elif event == 'pull_request_target':
              pr = data.get('pull_request', {})
              require(data.get('action') == 'closed' and pr.get('state') == 'closed' and pr.get('merged') is True)
              require(ref == 'refs/heads/main' and pr.get('base', {}).get('ref') == 'main')
              require(pr.get('base', {}).get('repo', {}).get('full_name') == repo)
              require(commit == pr.get('merge_commit_sha'))
              write = repo == 'michibiki-io/shirube-os'
          elif event == 'pull_request':
              pr = data.get('pull_request', {})
              require(data.get('action') == 'labeled')
              require(data.get('label', {}).get('name') in {'validate-staged', 'validate-staged-warm'})
              require(re.fullmatch(r'refs/pull/[1-9][0-9]*/merge', ref) is not None)
              require(pr.get('base', {}).get('repo', {}).get('full_name') == repo)
              require(commit == pr.get('head', {}).get('sha'))
          else:
              require(False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('cache-write=' + str(write).lower() + '\n')
          PYCODE
  compiler:
    permissions:
      contents: read
    needs: [admission]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Validate intentional cache mode and exact source
        env:
          CACHE_MODE: ${{ inputs.cache-mode }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          BUILD_ARCHITECTURE: ${{ matrix.architecture }}
          TASK_STORAGE: ${{ runner.temp }}
        run: |
          case "$CACHE_MODE" in cold|warm) ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 -c 'import os; from pathlib import Path; from producer.architecture import preflight; preflight(os.environ["BUILD_ARCHITECTURE"],Path(os.environ["TASK_STORAGE"]))'
      - name: Compute compiler toolchain cache namespace
        id: toolchain
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 -m producer.component_inputs compiler-key --project . --architecture "$ARCHITECTURE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          cache-binary: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          file: containers/native/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          build-args: |
            BASE=${{ matrix.architecture == 'amd64' && 'debian@sha256:c67e92c8099ba22853ab4cfda7cfb494d253d6012ca82dee98ba8976772af018' || 'debian@sha256:ec8534cda2cb30f29f44f23e135297af7a1496f2990fd8e4e84aa36b081a757a' }}
          cache-from: ${{ inputs.cache-mode == 'warm' && format('type=gha,scope={0}', steps.toolchain.outputs.key) || '' }}
          no-cache: ${{ inputs.cache-mode == 'cold' }}
          cache-to: ${{ needs.admission.outputs.cache-write == 'true' && format('type=gha,mode=max,ignore-error=true,scope={0}', steps.toolchain.outputs.key) || '' }}
      - name: Export exact native compiler
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_ID: ${{ github.run_id }}
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          COMPILER_ARTIFACT: ${{ runner.temp }}/compiler-artifact
        run: |
          python3 -m producer.compiler_artifact export --directory "$COMPILER_ARTIFACT" \
            --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE" --run-id "$RUN_ID" --image "$COMPILER_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shirube-compiler-${{ matrix.architecture }}
          path: ${{ runner.temp }}/compiler-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
  native:
    needs: [admission, compiler]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shirube-compiler-${{ matrix.architecture }}
          path: ${{ runner.temp }}/compiler-artifact
      - name: Verify and load exact same-run compiler
        id: image
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_ID: ${{ github.run_id }}
          COMPILER_ARTIFACT: ${{ runner.temp }}/compiler-artifact
        run: |
          python3 -m producer.compiler_artifact load --directory "$COMPILER_ARTIFACT" \
            --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE" --run-id "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Compute exact inner scope key using verified compiler
        id: scope
        env:
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "$COMPILER_IMAGE" -m producer.component_inputs stage-key \
            --stage native --architecture "$ARCHITECTURE" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: inputs.cache-mode == 'warm'
        id: cache
        with:
          path: ${{ runner.temp }}/stage-cache
          key: ${{ steps.scope.outputs.key }}
      - name: Import bounded original Release stage on warm miss
        if: needs.admission.outputs.cache-write == 'true' && github.event_name == 'pull_request_target' && inputs.cache-mode == 'warm' && steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_WRITE: ${{ needs.admission.outputs.cache-write }}
          CACHE_MODE: ${{ inputs.cache-mode }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          STAGE: native
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          STAGE_KEY: ${{ steps.scope.outputs.key }}
          STAGE_CACHE: ${{ runner.temp }}/stage-cache
        run: |
          python3 scripts/import_release_stage.py --stage "$STAGE" --architecture "$ARCHITECTURE" \
            --commit "$SOURCE_COMMIT" --key "$STAGE_KEY" --cache "$STAGE_CACHE"
      - name: Execute native with verified predecessors
        env:
          STAGE: native
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          STAGE_INPUTS: ${{ runner.temp }}/stage-inputs
          STAGE_OUTPUT: ${{ runner.temp }}/stage-output
          STAGE_CACHE: ${{ runner.temp }}/stage-cache
        run: |
          python3 scripts/run-native-stage.py --stage "$STAGE" --architecture "$ARCHITECTURE" \
            --commit "$SOURCE_COMMIT" --version "$VERSION" --image "$COMPILER_IMAGE" \
            --inputs "$STAGE_INPUTS" --output "$STAGE_OUTPUT" --cache "$STAGE_CACHE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.admission.outputs.cache-write == 'true' && success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/stage-cache
          key: ${{ steps.scope.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shirube-stage-${{ matrix.architecture }}-native
          path: |
            ${{ runner.temp }}/stage-output/native.tar
            ${{ runner.temp }}/stage-output/native.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shirube-stage-metrics-${{ matrix.architecture }}-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-output/*resources.json
            ${{ runner.temp }}/stage-output/*diagnostic.json
          if-no-files-found: warn
          retention-days: 14
