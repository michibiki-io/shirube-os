        run: |
          python3 -m producer.compiler_artifact load --directory "$COMPILER_ARTIFACT" \
            --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE" --run-id "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Inspect optional kernel cache source contract
        id: kernel-cache-capability
        run: |
          python3 -I - <<'PYTHON'
          import ast
          import os
          from pathlib import Path

          supported = False
          try:
              # Parse only: never execute checked-out source to probe support.
              tree = ast.parse(Path('scripts/kernel_compile_cache.py').read_text())
              declarations = [node for node in tree.body if isinstance(node, ast.Assign)
                              and any(isinstance(t, ast.Name) and t.id == 'KERNEL_CACHE_CONTRACT'
                                      for t in node.targets)]
              stores = [node for node in ast.walk(tree) if isinstance(node, ast.Name)
                        and node.id == 'KERNEL_CACHE_CONTRACT' and isinstance(node.ctx, ast.Store)]
              supported = (len(stores) == 1 and len(declarations) == 1 and len(declarations[0].targets) == 1
                           and isinstance(declarations[0].value, ast.Constant)
                           and declarations[0].value.value == 'reader-v1-explicit-export')
          except (OSError, SyntaxError, UnicodeError, ValueError):
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
