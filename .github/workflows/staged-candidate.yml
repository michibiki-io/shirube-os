        if: github.repository == 'michibiki-io/shirube-os' && steps.kernel-cache-capability.outputs.supported == 'true'
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_WRITE: ${{ needs.admission.outputs.cache-write }}
          KERNEL_CACHE_WRITE: ${{ needs.admission.outputs.kernel-write }}
          PRODUCER_KIND: ${{ inputs.producer-kind }}
          CACHE_MODE: ${{ inputs.cache-mode }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          KERNEL_CACHE: ${{ runner.temp }}/kernel-compiler-cache
        run: |
          python3 scripts/kernel_compile_cache.py import --directory "$KERNEL_CACHE" \
            --architecture "$ARCHITECTURE" --commit "$SOURCE_COMMIT"
