          path: ${{ runner.temp }}/compiler-artifact
      - name: Verify and load exact same-run compiler
        id: image
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_ID: ${{ github.run_id }}
          COMPILER_ARTIFACT: ${{ runner.temp }}/compiler-artifact
        run: |
          python3 -m producer.compiler_artifact load --discard-archive --directory "$COMPILER_ARTIFACT" \
            --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE" --run-id "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Execute clearance with verified predecessors
        env:
          STAGE: clearance
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          STAGE_INPUTS: ${{ runner.temp }}/stage-inputs
          STAGE_OUTPUT: ${{ runner.temp }}/stage-output
          STAGE_CACHE: ${{ runner.temp }}/stage-cache
        run: |
          python3 scripts/run-native-stage.py --discard-input-archives --stage "$STAGE" --architecture "$ARCHITECTURE" \
            --commit "$SOURCE_COMMIT" --version "$VERSION" --image "$COMPILER_IMAGE" \
            --inputs "$STAGE_INPUTS" --output "$STAGE_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shirube-stage-${{ matrix.architecture }}-clearance
          path: |
            ${{ runner.temp }}/stage-output/clearance.tar
            ${{ runner.temp }}/stage-output/clearance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shirube-stage-metrics-${{ matrix.architecture }}-clearance-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-output/*resources.json
            ${{ runner.temp }}/stage-output/*diagnostic.json
          if-no-files-found: warn
          retention-days: 14
  guests:
    if: inputs.purpose != 'seed'
    permissions:
      contents: read
    cache-mode: read
    needs: [admission, compiler, clearance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shirube-stage-${{ matrix.architecture }}-clearance
          path: ${{ runner.temp }}/stage-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shirube-compiler-${{ matrix.architecture }}
          path: ${{ runner.temp }}/compiler-artifact
      - name: Verify and load exact same-run compiler
        id: image
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_ID: ${{ github.run_id }}
          COMPILER_ARTIFACT: ${{ runner.temp }}/compiler-artifact
        run: |
          python3 -m producer.compiler_artifact load --discard-archive --directory "$COMPILER_ARTIFACT" \
            --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE" --run-id "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Execute guests with verified predecessors
        env:
          STAGE: guests
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          COMPILER_IMAGE: ${{ steps.image.outputs.imageid }}
          STAGE_INPUTS: ${{ runner.temp }}/stage-inputs
          STAGE_OUTPUT: ${{ runner.temp }}/stage-output
          STAGE_CACHE: ${{ runner.temp }}/stage-cache
        run: |
          python3 scripts/run-native-stage.py --discard-input-archives --stage "$STAGE" --architecture "$ARCHITECTURE" \
            --commit "$SOURCE_COMMIT" --version "$VERSION" --image "$COMPILER_IMAGE" \
            --inputs "$STAGE_INPUTS" --output "$STAGE_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shirube-candidate-${{ matrix.architecture }}
          path: ${{ runner.temp }}/stage-output/candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shirube-stage-metrics-${{ matrix.architecture }}-guests-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-output/*resources.json
            ${{ runner.temp }}/stage-output/*diagnostic.json
          if-no-files-found: warn
          retention-days: 14
