name: Produce trusted kernel compiler seed
on:
  workflow_dispatch:
    inputs:
      cache-mode:
        description: Warm ensures coverage; cold forces selected architectures without prior fetch
        type: choice
        options: [cold, warm]
        default: warm
      architectures:
        description: Requested seed architectures
        type: choice
        options: ["amd64,arm64", amd64, arm64]
        default: "amd64,arm64"
cache-mode: read
permissions:
  contents: read
concurrency:
  group: ${{ github.repository == 'michibiki-io/shirube-os' && github.ref == 'refs/heads/main' && 'shirube-os-release' || format('shirube-kernel-seed-{0}-{1}', github.repository, github.ref) }}
  queue: max
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'michibiki-io/shirube-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      selected: ${{ steps.probe.outputs.selected }}
      status: ${{ steps.probe.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure selected architecture coverage inside producer queue
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_CACHE_WRITE: 'true'
          PRODUCER_KIND: manual-seed
          SOURCE_COMMIT: ${{ github.sha }}
          ARCHITECTURES: ${{ inputs.architectures }}
          CACHE_MODE: ${{ inputs.cache-mode }}
        run: |
          python3 scripts/kernel_seed_plan.py --commit "$SOURCE_COMMIT" --architectures "$ARCHITECTURES" \
            --cache-mode "$CACHE_MODE" --output "${{ runner.temp }}/kernel-seed-plan/plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kernel-seed-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-seed-plan/plan.json
          if-no-files-found: error
          retention-days: 30
  seed:
    needs: plan
    if: needs.plan.outputs.selected != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/staged-candidate.yml
    with:
      commit: ${{ github.sha }}
      version: v2026.03.0
      cache-mode: ${{ inputs.cache-mode }}
      purpose: seed
      producer-kind: manual-seed
      architectures: ${{ needs.plan.outputs.selected }}
