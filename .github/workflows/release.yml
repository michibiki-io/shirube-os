name: Build and release images
on:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shirube-os-release
  queue: max
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      noop: ${{ steps.plan.outputs.noop }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # Closed + merged guard; this is the base-repository merge SHA, never the fork head.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          clean: false
      - name: Validate exact merged source before expensive builds
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build-packages.sh scripts/build-release.sh containers/native/package.sh
      - id: plan
        name: Resolve merged commit and version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m producer.actions resolve
  build:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true' && needs.resolve.outputs.noop != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/staged-candidate.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      cache-mode: warm
  stage:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shirube-candidate-${{ matrix.architecture }}
          path: ${{ runner.temp }}/candidate
      - name: Validate exact candidate before staging in its reserved draft
        env:
          GH_TOKEN: ${{ github.token }}
          SHIRUBE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/candidate
          SHIRUBE_ARCHITECTURE: ${{ matrix.architecture }}
          SHIRUBE_VERSION: ${{ needs.resolve.outputs.version }}
          SHIRUBE_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 -m producer.actions stage
  publish:
    timeout-minutes: 30
    needs: [resolve, build, stage]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.eligible == 'true' && needs.resolve.outputs.noop != 'true' && needs.build.result == 'success' && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          # Closed + merged guard; this is the base-repository merge SHA, never the fork head.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          clean: false
      - name: Verify both candidates, sources, checksums and every required gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHIRUBE_PUBLIC_DIRECTORY: ${{ runner.temp }}/shirube-public-${{ github.run_id }}-${{ github.run_attempt }}
          SHIRUBE_VERSION: ${{ needs.resolve.outputs.version }}
          SHIRUBE_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 -m producer.actions publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: assets
        with:
          name: shirube-os-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shirube-public-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          compression-level: 0
      - name: Publish only after successful verified Actions artifact upload
        env:
          GH_TOKEN: ${{ github.token }}
          SHIRUBE_VERSION: ${{ needs.resolve.outputs.version }}
          SHIRUBE_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          SHIRUBE_ACTIONS_ARTIFACT_ID: ${{ steps.assets.outputs.artifact-id }}
          SHIRUBE_ACTIONS_ARTIFACT_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
        run: python3 -m producer.actions promote
